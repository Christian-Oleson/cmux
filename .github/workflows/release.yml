name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build + upload release artifacts
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Install cargo-wix
        run: cargo install cargo-wix --version "^0.3" --locked

      - name: Build MSI
        shell: pwsh
        run: |
          # WiX v3 is pre-installed on windows-latest runners, but not on
          # PATH. Add it so cargo-wix can find candle.exe and light.exe.
          $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wixDir) {
            $env:PATH = "$($wixDir.FullName)\bin;$env:PATH"
          } else {
            # Fallback: install WiX 3.x via chocolatey
            choco install wixtoolset -y --no-progress
          }
          cargo wix -p cmux-daemon --nocapture

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "release-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/cmux-daemon.exe $stage/
          Copy-Item target/release/cmux-client.exe $stage/
          Copy-Item README.md $stage/
          Copy-Item REQUIREMENTS.md $stage/
          Copy-Item cmux-config/example/cmux.toml $stage/cmux.example.toml
          Copy-Item scripts/cmux-rpc.ps1 $stage/cmux-rpc.ps1
          $zip = "cmux-$tag-windows-x64.zip"
          Compress-Archive -Path $stage/* -DestinationPath $zip -Force

          # Copy the MSI to a predictable name for upload.
          $msi = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          if (-not $msi) {
            throw "No MSI found in target/wix/"
          }
          Copy-Item $msi.FullName "cmux-$tag-windows-x64.msi"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cmux-*.zip
            cmux-*.msi
          draft: false
          generate_release_notes: true
