[package]
name = "cmux-daemon"
version = "0.1.0"
edition = "2021"
authors = ["cmux contributors"]
description = "Background daemon for cmux, a native Windows terminal multiplexer"
license = "MIT OR Apache-2.0"

# Metadata consumed by `cargo wix` to build the MSI installer. The
# UpgradeCode GUID MUST be stable across versions so Windows treats new
# MSIs as upgrades of the same product instead of parallel installs.
# The path-guid is also persistent per-machine install directory.
[package.metadata.wix]
upgrade-guid = "3A7E2F8C-1D4B-4E9A-8F2C-9B5E7D1A6C4F"
path-guid    = "F1B2C3D4-5E6F-7A8B-9C0D-1E2F3A4B5C6D"
license      = false
eula         = false
name         = "cmux"
product-name = "cmux - Windows terminal multiplexer"
manufacturer = "cmux contributors"

[lib]
name = "cmux_daemon"
path = "src/lib.rs"

[[bin]]
name = "cmux-daemon"
path = "src/main.rs"

[dependencies]
cmux-core = { workspace = true }
cmux-ipc = { workspace = true }
cmux-config = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Pipes",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
